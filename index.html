function friendlyFetchError(err) {
  if (err instanceof TypeError && /fetch/i.test(err.message)) {
    return "Network request blocked — likely the artifact preview sandbox. This feature needs a real browser environment (try the local npm scaffold) rather than the in-chat preview.";
  }
  return err.message || "Fetch failed";
}

const RI = { 1: 0, 2: 0, 3: 0.58, 4: 0.9, 5: 1.12, 6: 1.24, 7: 1.32, 8: 1.41, 9: 1.45, 10: 1.49 };

function topsisScores(suppliers, variables, weights) {
  if (suppliers.length === 0 || variables.length === 0) return {};
  const denom = variables.map((v) => {
    const sumSq = suppliers.reduce((s, sup) => s + Math.pow(Number(sup.values[v.id] ?? 0), 2), 0);
    return Math.sqrt(sumSq) || 1;
  });
  const weighted = {};
  suppliers.forEach((s) => {
    weighted[s.id] = variables.map((v, idx) => {
      const raw = Number(s.values[v.id] ?? 0);
      return (weights[idx] || 0) * (raw / denom[idx]);
    });
  });
  const idealBest = variables.map((v, idx) => {
    const col = suppliers.map((s) => weighted[s.id][idx]);
    return v.direction === "lower" ? Math.min(...col) : Math.max(...col);
  });
  const idealWorst = variables.map((v, idx) => {
    const col = suppliers.map((s) => weighted[s.id][idx]);
    return v.direction === "lower" ? Math.max(...col) : Math.min(...col);
  });
  const scores = {};
  suppliers.forEach((s) => {
    const sPlus = Math.sqrt(weighted[s.id].reduce((sum, val, idx) => sum + Math.pow(val - idealBest[idx], 2), 0));
    const sMinus = Math.sqrt(weighted[s.id].reduce((sum, val, idx) => sum + Math.pow(val - idealWorst[idx], 2), 0));
    const denomC = sPlus + sMinus;
    scores[s.id] = denomC === 0 ? 0.5 : sMinus / denomC;
  });
  return scores;
}

function eigenWeights(matrix) {
  const n = matrix.length;
  if (n === 0) return { weights: [], lambdaMax: 0, ci: 0, cr: 0 };
  let vec = new Array(n).fill(1);
  for (let iter = 0; iter < 60; iter++) {
    const next = matrix.map((row) => row.reduce((s, v, j) => s + v * vec[j], 0));
    const norm = Math.sqrt(next.reduce((s, v) => s + v * v, 0)) || 1;
    vec = next.map((v) => v / norm);
  }
  const sum = vec.reduce((s, v) => s + v, 0) || 1;
  const weights = vec.map((v) => v / sum);
  const Av = matrix.map((row) => row.reduce((s, v, j) => s + v * weights[j], 0));
  const lambdaMax = Av.reduce((s, v, i) => s + v / (weights[i] || 1e-9), 0) / n;
  const ci = n > 2 ? (lambdaMax - n) / (n - 1) : 0;
  const cr = RI[n] ? ci / RI[n] : 0;
  return { weights, lambdaMax, ci, cr };
}

function geomMean(matrices) {
  if (matrices.length === 0) return [];
  const n = matrices[0].length;
  const agg = Array.from({ length: n }, () => new Array(n).fill(1));
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      let prod = 1;
      matrices.forEach((m) => (prod *= m[i][j]));
      agg[i][j] = Math.pow(prod, 1 / matrices.length);
    }
  }
  return agg;
}

function SourcingDashboard() {
  const [active, setActive] = useState("variables");

  const [variables, setVariables] = useState([
    { id: uid(), name: "Cost competitiveness", direction: "lower" },
    { id: uid(), name: "Quality (defect rate/PPM, batch rejection)", direction: "lower" },
    { id: uid(), name: "Delivery reliability (OTIF %)", direction: "higher" },
    { id: uid(), name: "Lead-time consistency (mean + variance)", direction: "higher" },
    { id: uid(), name: "Financial stability (credit proxy, years in business)", direction: "higher" },
    { id: uid(), name: "Compliance/certification (GMP, ISO)", direction: "higher" },
    { id: uid(), name: "Capacity flexibility", direction: "higher" },
    { id: uid(), name: "Responsiveness/communication", direction: "higher" },
  ]);

  const [expertCount, setExpertCount] = useState(1);
  const [expertMatrices, setExpertMatrices] = useState({});

  const [suppliers, setSuppliers] = useState([
    { id: uid(), name: "Supplier A", location: "Baddi, HP", values: {}, capacity: 1000, moq: 100 },
    { id: uid(), name: "Supplier B", location: "Daman", values: {}, capacity: 800, moq: 50 },
  ]);

  const [constraints, setConstraints] = useState([
    { id: uid(), label: "Minimum composite score", variable: "composite", op: ">=", value: 0.5 },
  ]);

  const [demand, setDemand] = useState(1200);
  const [rainfallRisk, setRainfallRisk] = useState({});
  const [rainfallMeta, setRainfallMeta] = useState({});
  const [rainfallLoading, setRainfallLoading] = useState(false);

  async function fetchLiveRainfallForLocation(location) {
    const geoRes = await fetch(
      `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(location)}&count=1`
    );
    const geoData = await geoRes.json();
    const place = geoData.results?.[0];
    if (!place) throw new Error("Location not found");

    // Historical baseline: what counts as "heavy rain" for THIS location.
    const histEnd = new Date();
    histEnd.setDate(histEnd.getDate() - 5);
    const histStart = new Date(histEnd);
    histStart.setDate(histStart.getDate() - 365);
    const fmt = (d) => d.toISOString().slice(0, 10);

    const histRes = await fetch(
      `https://archive-api.open-meteo.com/v1/archive?latitude=${place.latitude}&longitude=${place.longitude}` +
        `&start_date=${fmt(histStart)}&end_date=${fmt(histEnd)}&daily=precipitation_sum&timezone=auto`
    );
    const histData = await histRes.json();
    const histValues = (histData.daily?.precipitation_sum || []).filter((v) => v !== null);
    const sorted = [...histValues].sort((a, b) => a - b);
    const p90 = sorted.length ? sorted[Math.floor(sorted.length * 0.9)] : 0;

    // Live signal: current conditions + 7-day forecast, from Open-Meteo's forecast endpoint.
    const liveRes = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}` +
        `&current=precipitation&daily=precipitation_sum&forecast_days=7&timezone=auto`
    );
    const liveData = await liveRes.json();
    const currentPrecip = liveData.current?.precipitation ?? 0;
    const forecast = liveData.daily?.precipitation_sum || [];
    const exceedDays = forecast.filter((v) => v !== null && v > p90).length;
    const risk = forecast.length ? Math.round((exceedDays / forecast.length) * 100) : 0;

    return {
      risk,
      detail:
        `${exceedDays}/${forecast.length} of next-7-day forecast exceed this location's 1-year P90 (${p90.toFixed(1)}mm)` +
        (currentPrecip > 0 ? `; raining now, ${currentPrecip}mm/hr` : "; no rain currently"),
      place: `${place.name}${place.admin1 ? ", " + place.admin1 : ""}${place.country ? ", " + place.country : ""}`,
    };
  }

  async function runFetchAllLiveRainfall() {
    setRainfallLoading(true);
    for (const sup of suppliers) {
      if (!sup.location || !sup.location.trim()) {
        setRainfallMeta((m) => ({ ...m, [sup.id]: { source: "error", detail: "No location set" } }));
        continue;
      }
      try {
        const result = await fetchLiveRainfallForLocation(sup.location);
        setRainfallRisk((r) => ({ ...r, [sup.id]: result.risk }));
        setRainfallMeta((m) => ({
          ...m,
          [sup.id]: { source: "live", detail: result.detail, place: result.place, fetchedAt: new Date().toLocaleString() },
        }));
      } catch (err) {
        setRainfallMeta((m) => ({ ...m, [sup.id]: { source: "error", detail: friendlyFetchError(err) } }));
      }
    }
    setRainfallLoading(false);
  }

  const [fetchingId, setFetchingId] = useState(null);
  const [autoTrack, setAutoTrack] = useState(false);

  useEffect(() => {
    if (!autoTrack) return;
    const id = setInterval(() => {
      runFetchAllLiveRainfall();
    }, 15 * 60 * 1000); // 15 min
    return () => clearInterval(id);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [autoTrack, suppliers]);

  async function fetchOneSupplierRainfall(sup) {
    if (!sup.location || !sup.location.trim()) {
      setRainfallMeta((m) => ({ ...m, [sup.id]: { source: "error", detail: "No location set" } }));
      return;
    }
    setFetchingId(sup.id);
    try {
      const result = await fetchLiveRainfallForLocation(sup.location);
      setRainfallRisk((r) => ({ ...r, [sup.id]: result.risk }));
      setRainfallMeta((m) => ({
        ...m,
        [sup.id]: { source: "live", detail: result.detail, place: result.place, fetchedAt: new Date().toLocaleString() },
      }));
    } catch (err) {
      setRainfallMeta((m) => ({ ...m, [sup.id]: { source: "error", detail: friendlyFetchError(err) } }));
    }
    setFetchingId(null);
  }

  const [sensVar, setSensVar] = useState(null);
  const [sensWeight, setSensWeight] = useState(30);

  const n = variables.length;

  function getMatrix(expertIdx) {
    const key = String(expertIdx);
    if (expertMatrices[key]) return expertMatrices[key];
    return Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => (i === j ? 1 : 1)));
  }

  function setCell(expertIdx, i, j, val) {
    const key = String(expertIdx);
    const m = getMatrix(expertIdx).map((row) => row.slice());
    m[i][j] = val;
    m[j][i] = 1 / val;
    setExpertMatrices((prev) => ({ ...prev, [key]: m }));
  }

  const aggregatedMatrix = useMemo(() => {
    const mats = Array.from({ length: expertCount }, (_, k) => getMatrix(k));
    return expertCount > 1 ? geomMean(mats) : mats[0];
  }, [expertCount, expertMatrices, n]);

  const ahp = useMemo(() => eigenWeights(aggregatedMatrix || []), [aggregatedMatrix]);

  const adjustedWeights = useMemo(() => {
    const idx = variables.findIndex((v) => v.id === sensVar);
    if (idx === -1) return ahp.weights;
    const target = sensWeight / 100;
    const others = ahp.weights.filter((_, i) => i !== idx);
    const othersSum = others.reduce((s, w) => s + w, 0) || 1;
    const remaining = 1 - target;
    return ahp.weights.map((w, i) => (i === idx ? target : (w / othersSum) * remaining));
  }, [ahp.weights, sensVar, sensWeight, variables]);

  const adjustedScores = useMemo(
    () => (sensVar ? topsisScores(suppliers, variables, adjustedWeights) : null),
    [suppliers, variables, adjustedWeights, sensVar]
  );

  function addVariable() {
    setVariables((v) => [...v, { id: uid(), name: `Variable ${v.length + 1}`, direction: "higher" }]);
    setExpertMatrices((prev) => {
      const next = {};
      Object.keys(prev).forEach((key) => {
        const m = prev[key].map((row) => [...row, 1]);
        m.push(new Array(m[0]?.length || 1).fill(1));
        next[key] = m;
      });
      return next;
    });
  }
  function removeVariable(id) {
    const idx = variables.findIndex((v) => v.id === id);
    setVariables((v) => v.filter((x) => x.id !== id));
    if (idx === -1) return;
    setExpertMatrices((prev) => {
      const next = {};
      Object.keys(prev).forEach((key) => {
        const m = prev[key].filter((_, i) => i !== idx).map((row) => row.filter((_, j) => j !== idx));
        next[key] = m;
      });
      return next;
    });
  }

  function addSupplier() {
    setSuppliers((s) => [...s, { id: uid(), name: `Supplier ${s.length + 1}`, location: "", values: {}, capacity: 500, moq: 50 }]);
  }
  function removeSupplier(id) {
    setSuppliers((s) => s.filter((x) => x.id !== id));
  }
  function setSupplierValue(sid, varId, val) {
    setSuppliers((s) => s.map((sup) => (sup.id === sid ? { ...sup, values: { ...sup.values, [varId]: val } } : sup)));
  }

  const fileInputRef = useRef(null);
  const [importError, setImportError] = useState(null);
  const weightsFileInputRef = useRef(null);
  const [weightsImportError, setWeightsImportError] = useState(null);

  function normalize(str) {
    return String(str || "")
      .toLowerCase()
      .replace(/\(.*?\)/g, "")
      .replace(/[^a-z0-9]/g, "");
  }

  function handleImportFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setImportError(null);
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const wb = XLSX.read(evt.target.result, { type: "binary" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
        if (rows.length === 0) {
          setImportError("No rows found in the first sheet.");
          return;
        }
        const headers = Object.keys(rows[0]);
        const findHeader = (matcher) => headers.find((h) => matcher(normalize(h)));
        const nameHeader = findHeader((h) => h.includes("name") || h.includes("supplier") || h.includes("vendor")) || headers[0];
        const locationHeader = findHeader((h) => h.includes("location"));
        const capacityHeader = findHeader((h) => h.includes("capacity"));
        const moqHeader = findHeader((h) => h.includes("moq") || h.includes("minimum"));

        const varHeaderMap = variables.map((v) => {
          const nv = normalize(v.name);
          const match = headers.find((h) => {
            const nh = normalize(h);
            return nh === nv || nh.includes(nv) || nv.includes(nh);
          });
          return { variable: v, header: match };
        });

        const unmatched = varHeaderMap.filter((m) => !m.header).map((m) => m.variable.name);

        const imported = rows.map((row) => {
          const values = {};
          varHeaderMap.forEach(({ variable, header }) => {
            if (header) values[variable.id] = Number(row[header]) || 0;
          });
          return {
            id: uid(),
            name: String(row[nameHeader] ?? `Supplier ${uid()}`),
            location: locationHeader ? String(row[locationHeader] ?? "") : "",
            values,
            capacity: capacityHeader ? Number(row[capacityHeader]) || 500 : 500,
            moq: moqHeader ? Number(row[moqHeader]) || 50 : 50,
          };
        });

        setSuppliers((s) => [...s, ...imported]);
        if (unmatched.length > 0) {
          setImportError(
            `Imported ${imported.length} supplier(s). No column matched for: ${unmatched.join(", ")} — those values default to 0, edit them manually.`
          );
        } else {
          setImportError(`Imported ${imported.length} supplier(s) successfully.`);
        }
      } catch (err) {
        setImportError("Could not read that file. Make sure it's a valid .xlsx, .xls, or .csv export.");
      }
    };
    reader.readAsBinaryString(file);
    e.target.value = "";
  }

  function downloadTemplate() {
    const headerRow = { Supplier: "", Location: "", Capacity: "", MOQ: "" };
    variables.forEach((v) => (headerRow[v.name] = ""));
    const ws = XLSX.utils.json_to_sheet([headerRow]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Suppliers");
    XLSX.writeFile(wb, "supplier_import_template.xlsx");
  }

  function matchVar(label) {
    const nh = normalize(label);
    return variables.find((v) => {
      const nv = normalize(v.name);
      return nv === nh || nh.includes(nv) || nv.includes(nh);
    });
  }

  function downloadWeightsTemplate() {
    const wb = XLSX.utils.book_new();
    Array.from({ length: expertCount }).forEach((_, ex) => {
      const m = getMatrix(ex);
      const aoa = [["", ...variables.map((v) => v.name)]];
      variables.forEach((vi, i) => {
        aoa.push([vi.name, ...variables.map((vj, j) => Number(m[i][j].toFixed(4)))]);
      });
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      XLSX.utils.book_append_sheet(wb, ws, `Expert ${ex + 1}`.slice(0, 31));
    });
    XLSX.writeFile(wb, "ahp_weights_template.xlsx");
  }

  function handleImportWeightsFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setWeightsImportError(null);
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const wb = XLSX.read(evt.target.result, { type: "binary" });
        const sheetNames = wb.SheetNames;
        if (sheetNames.length === 0) {
          setWeightsImportError("No sheets found in that file.");
          return;
        }
        const usedSheets = sheetNames.slice(0, 6);
        const newMatrices = {};
        const unmatched = [];
        usedSheets.forEach((sheetName, ex) => {
          const sheet = wb.Sheets[sheetName];
          const aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
          if (aoa.length < 2) return;
          const colVars = aoa[0].slice(1).map((h) => matchVar(h));
          const m = getMatrix(ex).map((row) => row.slice());
          variables.forEach((vi, i) => {
            const rowIdx = aoa.slice(1).findIndex((row) => matchVar(row[0])?.id === vi.id);
            variables.forEach((vj, j) => {
              if (i >= j) return;
              const colIdx = colVars.findIndex((v) => v?.id === vj.id);
              if (rowIdx === -1 || colIdx === -1) {
                unmatched.push(`${sheetName}: ${vi.name} × ${vj.name}`);
                return;
              }
              const raw = Number(aoa[rowIdx + 1][colIdx + 1]);
              const val = raw > 0 ? raw : 1;
              m[i][j] = val;
              m[j][i] = 1 / val;
            });
          });
          newMatrices[String(ex)] = m;
        });
        setExpertMatrices((prev) => ({ ...prev, ...newMatrices }));
        setExpertCount((c) => Math.max(c, Math.min(6, usedSheets.length)));
        if (unmatched.length > 0) {
          setWeightsImportError(
            `Imported ${usedSheets.length} sheet(s). Some cells didn't match a variable name and were left as-is: ${unmatched
              .slice(0, 5)
              .join("; ")}${unmatched.length > 5 ? "…" : ""}`
          );
        } else {
          setWeightsImportError(`Imported ${usedSheets.length} expert sheet(s) successfully.`);
        }
      } catch (err) {
        setWeightsImportError("Could not read that file. Make sure it matches the downloaded template's layout.");
      }
    };
    reader.readAsBinaryString(file);
    e.target.value = "";
  }

  function addConstraint() {
    setConstraints((c) => [...c, { id: uid(), label: "New constraint", variable: variables[0]?.id || "composite", op: ">=", value: 0 }]);
  }
  function removeConstraint(id) {
    setConstraints((c) => c.filter((x) => x.id !== id));
  }

  // TOPSIS: vector-normalize the decision matrix, weight it, measure distance
  // to the ideal-best and ideal-worst vectors, rank by closeness coefficient.
  const compositeScores = useMemo(() => topsisScores(suppliers, variables, ahp.weights), [suppliers, variables, ahp.weights]);

  function passesConstraints(supplier) {
    return constraints.every((c) => {
      let val;
      if (c.variable === "composite") val = compositeScores[supplier.id] ?? 0;
      else val = Number(supplier.values[c.variable] ?? 0);
      const target = Number(c.value);
      if (c.op === ">=") return val >= target;
      if (c.op === "<=") return val <= target;
      return val === target;
    });
  }

  function allocate(withUncertainty, strategy) {
    const eligible = suppliers.filter(passesConstraints);
    if (eligible.length === 0) return { rows: [], totalCost: 0, unmet: demand };
    let ranked;
    if (strategy === "cheapest") {
      const costVar = variables.find((v) => /cost/i.test(v.name));
      ranked = [...eligible].sort((a, b) => Number(a.values[costVar?.id] ?? 0) - Number(b.values[costVar?.id] ?? 0));
    } else if (strategy === "highest-quality") {
      ranked = [...eligible].sort((a, b) => (compositeScores[b.id] ?? 0) - (compositeScores[a.id] ?? 0));
    } else if (strategy === "50-50") {
      ranked = eligible.slice(0, 2);
    } else {
      ranked = [...eligible].sort((a, b) => (compositeScores[b.id] ?? 0) - (compositeScores[a.id] ?? 0));
    }
    let remaining = demand;
    const rows = [];
    const activeSet = strategy === "50-50" ? ranked : ranked;
    const share = strategy === "50-50" ? demand / Math.max(activeSet.length, 1) : null;
    activeSet.forEach((sup) => {
      if (remaining <= 0) return;
      const risk = withUncertainty ? (rainfallRisk[sup.id] ?? 0) / 100 : 0;
      const effectiveCapacity = sup.capacity * (1 - risk);
      const alloc = strategy === "50-50" ? Math.min(share, effectiveCapacity) : Math.min(remaining, effectiveCapacity);
      if (alloc < sup.moq && alloc > 0) return;
      const costVar = variables.find((v) => /cost/i.test(v.name));
      const unitCost = Number(sup.values[costVar?.id] ?? 1);
      rows.push({ supplier: sup.name, allocated: Math.round(alloc), unitCost, cost: Math.round(alloc * unitCost), risk: Math.round(risk * 100) });
      remaining -= alloc;
    });
    const totalCost = rows.reduce((s, r) => s + r.cost, 0);
    return { rows, totalCost, unmet: Math.max(0, Math.round(remaining)) };
  }

  const resultDet = useMemo(() => allocate(false, "optimized"), [suppliers, constraints, compositeScores, demand]);
  const resultUnc = useMemo(() => allocate(true, "optimized"), [suppliers, constraints, compositeScores, demand, rainfallRisk]);
  const naiveCheap = useMemo(() => allocate(false, "cheapest"), [suppliers, constraints, compositeScores, demand]);
  const naiveQuality = useMemo(() => allocate(false, "highest-quality"), [suppliers, constraints, compositeScores, demand]);
  const naiveSplit = useMemo(() => allocate(false, "50-50"), [suppliers, constraints, compositeScores, demand]);

  const [mcResult, setMcResult] = useState(null);
  const [mcRunning, setMcRunning] = useState(false);

  function runMonteCarlo(iterations = 1000) {
    setMcRunning(true);
    // Fixed Step-3 plan: the deterministic optimized allocation. Monte Carlo does
    // not re-optimize per iteration — it measures how that fixed plan holds up
    // under random supplier disruption.
    const plan = resultDet.rows.map((r) => {
      const sup = suppliers.find((s) => s.name === r.supplier);
      return { ...r, supplierObj: sup };
    });

    // Disruption probability per supplier: base rate, raised by rainfall risk,
    // raised further the lower the supplier's TOPSIS score (docx Step 4 spec).
    const pDisrupt = {};
    plan.forEach((r) => {
      const c = compositeScores[r.supplierObj?.id] ?? 0.5;
      const rain = (rainfallRisk[r.supplierObj?.id] ?? 0) / 100;
      pDisrupt[r.supplier] = Math.min(0.9, 0.05 + (1 - c) * 0.35 + rain * 0.5);
    });

    // Common-cause correlation: suppliers sharing a location string share one
    // random draw, so a bad monsoon week can take out more than one vendor at once.
    const locationGroups = {};
    plan.forEach((r) => {
      const loc = (r.supplierObj?.location || "").trim().toLowerCase() || `__unique_${r.supplier}`;
      if (!locationGroups[loc]) locationGroups[loc] = [];
      locationGroups[loc].push(r.supplier);
    });

    const costs = [];
    const serviceLevels = [];
    for (let iter = 0; iter < iterations; iter++) {
      const sharedDraw = {};
      Object.keys(locationGroups).forEach((loc) => (sharedDraw[loc] = Math.random()));
      let delivered = 0;
      let cost = 0;
      plan.forEach((r) => {
        const loc = (r.supplierObj?.location || "").trim().toLowerCase() || `__unique_${r.supplier}`;
        const draw = sharedDraw[loc];
        const disrupted = draw < pDisrupt[r.supplier];
        if (!disrupted) {
          delivered += r.allocated;
          cost += r.cost;
        }
      });
      costs.push(cost);
      serviceLevels.push(demand > 0 ? delivered / demand : 0);
    }
    costs.sort((a, b) => a - b);
    const mean = (arr) => arr.reduce((s, v) => s + v, 0) / (arr.length || 1);
    const pct = (arr, p) => arr[Math.min(arr.length - 1, Math.floor((p / 100) * arr.length))];
    const buckets = 12;
    const min = costs[0] ?? 0;
    const max = costs[costs.length - 1] ?? 1;
    const width = (max - min) / buckets || 1;
    const hist = new Array(buckets).fill(0);
    costs.forEach((c) => {
      const b = Math.min(buckets - 1, Math.floor((c - min) / width));
      hist[b]++;
    });
    setMcResult({
      meanCost: mean(costs),
      p5: pct(costs, 5),
      p50: pct(costs, 50),
      p95: pct(costs, 95),
      meanService: mean(serviceLevels),
      minService: Math.min(...serviceLevels),
      hist,
      histMin: min,
      histMax: max,
      iterations,
    });
    setMcRunning(false);
  }

  const stepIndex = SECTIONS.findIndex((s) => s.id === active);

  const goPrev = () => stepIndex > 0 && setActive(SECTIONS[stepIndex - 1].id);

  const feasibleCount = suppliers.filter(passesConstraints).length;
  const bestScore = Object.values(compositeScores).length ? Math.max(...Object.values(compositeScores)) : 0;
  const crOk = ahp.cr < 0.1;

  return (
    <div
      className="w-full min-h-screen bg-surface-100 text-ink-900 text-[13px] leading-normal"
      style={{ fontFamily: '"IBM Plex Sans", "Segoe UI", sans-serif' }}

              style={{ fontFamily: '"IBM Plex Mono", monospace' }}
            >
              SRC&#8226;OPT
            </div>
            <div className="text-[11px] text-ink-500 mt-1 leading-snug">
              Vendor rating &amp; risk-based sourcing optimization
            </div>
          </div>
          <nav className="flex-1 overflow-y-auto py-1">
            {SECTIONS.map((s, idx) => {

              { label: "FEASIBLE", value: feasibleCount, dot: feasibleCount > 0 ? "good" : "bad" },

                <span className="text-[12.5px] font-semibold text-ink-900 tabular-nums" style={{ fontFamily: '"IBM Plex Mono", monospace' }}>
                  {k.value}
                </span>
              </div>
            ))}
          </div>

          <main className="max-w-4xl px-6 py-6">
        <div className="bg-white border border-line-200 rounded-sm p-6">
        {active === "variables" && (
          <Section title="Variables" subtitle="Quantifiable criteria used to evaluate suppliers. Add or remove any number.">
            <div className="space-y-2">
              {variables.map((v) => (
                <div key={v.id} className="flex items-center gap-2 bg-white border border-line-200 rounded px-3 py-2">
                  <input

        {active === "weights" && (

            <div className="mt-4 border-t border-line-200 pt-4">

              <div className="space-y-1">

                    <div className="flex-1 h-2 bg-surface-100 rounded overflow-hidden">
                      <div className="h-full bg-accent-600" style={{ width: `${(ahp.weights[idx] || 0) * 100}%` }} />

        {active === "suppliers" && (

              <button

            <div className="space-y-4">
              {suppliers.map((s) => (

        )}

        {active === "topsis" && (
          <Section title="TOPSIS ranking" subtitle="AHP weights applied to a vector-normalized decision matrix, ranked by closeness coefficient.">
            <div className="space-y-2">
              {[...suppliers]
                .sort((a, b) => (compositeScores[b.id] ?? 0) - (compositeScores[a.id] ?? 0))
                .map((s, rank) => {
                  const c = compositeScores[s.id] ?? 0;
                  const ok = passesConstraints(s);
                  return (
                    <div key={s.id} className="flex items-center gap-3 bg-white border border-line-200 rounded px-3 py-2">
                      <div className="w-6 text-xs font-mono text-ink-500">#{rank + 1}</div>
                      <div className="w-32 text-sm">{s.name}</div>
                      <div className="flex-1 h-2 bg-surface-100 rounded overflow-hidden">
                        <div className="h-full bg-accent-600" style={{ width: `${c * 100}%` }} />
                      </div>
                      <div className="w-14 text-right text-xs font-mono">{c.toFixed(3)}</div>
                      <div className={`w-24 text-right text-xs ${ok ? "text-good-600" : "text-bad-600"}`}>
                        {ok ? "eligible" : "excluded"}
                      </div>
                    </div>
                  );
                })}
            </div>
            <p className="text-xs text-ink-500 mt-4 leading-relaxed">
              C = S⁻ / (S⁺ + S⁻), where S⁺ and S⁻ are Euclidean distances from each supplier's weighted, vector-normalized
              scores to the ideal-best and ideal-worst vectors across all variables. Higher C ranks closer to ideal.
              "Eligible / excluded" reflects the constraints defined in the next section — a supplier can rank first here
              and still be excluded from allocation if it fails a hard constraint.
            </p>

            <div className="mt-8 pt-6 border-t border-line-200">
              <h3 className="text-sm font-semibold text-ink-900 mb-1">Sensitivity analysis</h3>
              <p className="text-xs text-ink-500 mb-4">
                Force one variable to a target weight, redistribute the rest proportionally, and see who moves. E.g. push
                Compliance/certification above Cost and check whether the ranking still holds.
              </p>
              <div className="flex items-center gap-3 mb-4">
                <select
                  className="bg-surface-100 text-xs rounded px-2 py-1.5 border border-line-300"
                  value={sensVar ?? ""}
                  onChange={(e) => setSensVar(e.target.value || null)}
                >
                  <option value="">Select a variable to override…</option>
                  {variables.map((v) => (
                    <option key={v.id} value={v.id}>
                      {v.name}
                    </option>
                  ))}
                </select>
                {sensVar && (
                  <>
                    <input
                      type="range"
                      min={0}
                      max={100}
                      value={sensWeight}
                      onChange={(e) => setSensWeight(Number(e.target.value))}
                      className="flex-1"
                    />
                    <span className="w-14 text-xs font-mono text-accent-700">{sensWeight}%</span>
                    <button onClick={() => setSensVar(null)} className="text-xs text-ink-400 hover:text-bad-600">
                      Clear
                    </button>
                  </>
                )}
              </div>

              {sensVar && adjustedScores && (
                <div className="space-y-1.5">
                  {[...suppliers]
                    .sort((a, b) => (compositeScores[b.id] ?? 0) - (compositeScores[a.id] ?? 0))
                    .map((s, baseRank) => {
                      const adjRanked = [...suppliers].sort(
                        (a, b) => (adjustedScores[b.id] ?? 0) - (adjustedScores[a.id] ?? 0)
                      );
                      const adjRank = adjRanked.findIndex((x) => x.id === s.id);
                      const delta = baseRank - adjRank;
                      return (
                        <div key={s.id} className="flex items-center gap-3 bg-white border border-line-200 rounded px-3 py-2 text-xs">
                          <div className="w-32 text-ink-500">{s.name}</div>
                          <div className="w-24 text-ink-500 font-mono">
                            #{baseRank + 1} → #{adjRank + 1}
                          </div>
                          <div className="w-16 font-mono text-ink-500">
                            {(compositeScores[s.id] ?? 0).toFixed(3)} → {(adjustedScores[s.id] ?? 0).toFixed(3)}
                          </div>
                          {delta !== 0 && (
                            <div className={`font-medium ${delta > 0 ? "text-good-600" : "text-bad-600"}`}>
                              {delta > 0 ? `↑ moved up ${delta}` : `↓ moved down ${Math.abs(delta)}`}
                            </div>
                          )}
                        </div>
                      );
                    })}
                </div>
              )}
            </div>
          </Section>
        )}

        {active === "constraints" && (
          <Section title="Constraints" subtitle="Numerical inequalities applied before allocation. A supplier failing any constraint is excluded.">
            <div className="space-y-2">
              {constraints.map((c) => (
                <div key={c.id} className="flex items-center gap-2 bg-white border border-line-200 rounded px-3 py-2">
                  <select
                    className="bg-surface-100 text-xs rounded px-2 py-1 border border-line-300"
                    value={c.variable}
                    onChange={(e) => setConstraints((cs) => cs.map((x) => (x.id === c.id ? { ...x, variable: e.target.value } : x)))}
                  >
                    <option value="composite">Composite score</option>
                    {variables.map((v) => (
                      <option key={v.id} value={v.id}>
                        {v.name}
                      </option>
                    ))}
                  </select>
                  <select
                    className="bg-surface-100 text-xs rounded px-2 py-1 border border-line-300"
                    value={c.op}
                    onChange={(e) => setConstraints((cs) => cs.map((x) => (x.id === c.id ? { ...x, op: e.target.value } : x)))}
                  >
                    <option value=">=">{"\u2265"}</option>
                    <option value="<=">{"\u2264"}</option>
                    <option value="=">=</option>
                  </select>
                  <input
                    type="number"
                    step="0.01"
                    className="w-24 bg-surface-100 border border-line-300 rounded px-2 py-1 text-sm"
                    value={c.value}
                    onChange={(e) => setConstraints((cs) => cs.map((x) => (x.id === c.id ? { ...x, value: Number(e.target.value) } : x)))}
                  />
                  <button onClick={() => removeConstraint(c.id)} className="ml-auto text-ink-500 hover:text-bad-600">
                    <Trash2 size={15} />
                  </button>
                </div>
              ))}
            </div>
            <button onClick={addConstraint} className="mt-3 flex items-center gap-1 text-xs text-accent-600 hover:text-accent-700">
              <Plus size={14} /> Add constraint
            </button>
          </Section>
        )}

        {active === "uncertainty" && (
          <Section title="Rainfall risk" subtitle="Live rainfall-disruption risk per supplier: current conditions + 7-day forecast vs. that location's own 1-year rainfall pattern.">
            <div className="flex items-center gap-3 mb-4">
              <button
                onClick={runFetchAllLiveRainfall}
                disabled={rainfallLoading}
                className="flex items-center gap-1.5 text-xs bg-accent-600 hover:bg-accent-700 disabled:opacity-50 text-white rounded px-3 py-1.5"
              >
                <CloudRain size={13} /> {rainfallLoading ? "Fetching..." : "Fetch live rainfall risk for all suppliers"}
              </button>
              <label className="flex items-center gap-1.5 text-xs text-ink-500 cursor-pointer">
                <input type="checkbox" checked={autoTrack} onChange={(e) => setAutoTrack(e.target.checked)} />
                Auto-refresh every 15 min while this tab is open
              </label>
            </div>
            <div className="space-y-2">
              {suppliers.map((s) => {
                const meta = rainfallMeta[s.id];
                return (
                  <div key={s.id} className="bg-white border border-line-200 rounded px-3 py-2">
                    <div className="flex items-center gap-3">
                      <div className="w-32 text-sm">{s.name}</div>
                      <div className="w-40 text-xs text-ink-500">{s.location || "no location set"}</div>
                      <input
                        type="range"
                        min={0}
                        max={100}
                        value={rainfallRisk[s.id] ?? 0}
                        onChange={(e) => {
                          setRainfallRisk((r) => ({ ...r, [s.id]: Number(e.target.value) }));
                          setRainfallMeta((m) => ({ ...m, [s.id]: { source: "manual", detail: "Manually overridden" } }));
                        }}
                        className="flex-1"
                      />
                      <div className="w-12 text-right text-xs font-mono text-accent-600">{rainfallRisk[s.id] ?? 0}%</div>
                    </div>
                    {meta && (
                      <div className={`text-xs mt-1.5 ${meta.source === "error" ? "text-bad-600" : "text-ink-500"}`}>
                        {meta.source === "live" && `Live — ${meta.place}: ${meta.detail} (fetched ${meta.fetchedAt})`}
                        {meta.source === "manual" && "Manually overridden"}
                        {meta.source === "error" && `Couldn't fetch: ${meta.detail}`}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
            <p className="text-xs text-ink-500 mt-4 leading-relaxed">
              Live fetch: geocodes each supplier's location, pulls 1 year of historical daily rainfall to establish
              that location's own 90th-percentile ("heavy rain") threshold, then checks current conditions and the
              7-day forecast against that threshold. Risk = % of the next 7 forecast days expected to exceed it — this
              is forward-looking, not a summary of what already happened. Auto-refresh re-runs this on a timer while
              you keep the tab open; it doesn't run when you're not here, since this is a browser app with no server.
              You can still drag any slider manually to override — that value is what actually drives the Optimize
              and Monte Carlo tabs either way.
            </p>
          </Section>
        )}

        {active === "montecarlo" && (
          <Section title="Monte Carlo simulation" subtitle="1000+ iterations of random supplier disruption applied to the fixed optimized allocation.">
            <button
              onClick={() => runMonteCarlo(1000)}
              disabled={mcRunning || resultDet.rows.length === 0}
              className="text-xs bg-accent-600 hover:bg-accent-700 disabled:opacity-50 text-white font-medium rounded px-3 py-2 mb-6"
            >
              {mcRunning ? "Running..." : "Run 1000 iterations"}
            </button>
            {resultDet.rows.length === 0 && (
              <p className="text-xs text-bad-600 mb-4">No suppliers in the deterministic allocation yet — check Suppliers, Constraints, and Optimize first.</p>
            )}
            {mcResult && (
              <>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                  <Stat label="Mean cost" value={`₹${Math.round(mcResult.meanCost).toLocaleString()}`} />
                  <Stat label="P5 – P95 cost" value={`₹${Math.round(mcResult.p5).toLocaleString()} – ₹${Math.round(mcResult.p95).toLocaleString()}`} />
                  <Stat label="Mean service level" value={`${(mcResult.meanService * 100).toFixed(1)}%`} />
                  <Stat label="Worst-case service level" value={`${(mcResult.minService * 100).toFixed(1)}%`} />
                </div>
                <div className="text-xs text-ink-500 mb-2">Cost distribution ({mcResult.iterations} iterations)</div>
                <div className="flex items-end gap-1 h-32 mb-2">
                  {mcResult.hist.map((h, i) => (
                    <div
                      key={i}
                      className="flex-1 bg-accent-500 rounded-t"
                      style={{ height: `${(h / Math.max(...mcResult.hist)) * 100}%` }}
                      title={`${h} iterations`}
                    />
                  ))}
                </div>
                <div className="flex justify-between text-xs text-ink-400 font-mono">
                  <span>₹{Math.round(mcResult.histMin).toLocaleString()}</span>
                  <span>₹{Math.round(mcResult.histMax).toLocaleString()}</span>
                </div>
              </>
            )}
            <p className="text-xs text-ink-500 mt-6 leading-relaxed">
              Disruption probability per supplier = base rate + (1 − TOPSIS score) weighting + rainfall-risk weighting,
              capped at 90%. Suppliers sharing the same location text share one random draw per iteration, so they can
              fail together (common-cause), matching the docx's correlated-disruption requirement. This measures the
              fixed Step 3 allocation under disruption — it does not re-optimize per iteration. That's Step 5's job
              (two-stage stochastic recourse), not built yet.
            </p>
          </Section>
        )}

        {active === "optimize" && (
          <Section title="Optimize & compare" subtitle="Allocation with and without uncertainty, benchmarked against naive strategies.">
            <div className="flex items-center gap-3 mb-6">
              <label className="text-xs text-ink-500">Total demand</label>
              <input
                type="number"
                value={demand}
                onChange={(e) => setDemand(Number(e.target.value))}
                className="w-28 bg-white border border-line-300 rounded px-2 py-1 text-sm"
              />
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
              <ResultCard title="Optimized — without uncertainty" result={resultDet} accent="emerald" demand={demand} />
              <ResultCard title="Optimized — with rainfall uncertainty" result={resultUnc} accent="sky" demand={demand} />
            </div>

            <div className="text-xs text-ink-500 mb-2 mt-8">Naive strategy comparison</div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <ResultCard title="Cheapest vendor only" result={naiveCheap} accent="slate" demand={demand} />
              <ResultCard title="Highest quality only" result={naiveQuality} accent="slate" demand={demand} />
              <ResultCard title="50-50 split" result={naiveSplit} accent="slate" demand={demand} />
            </div>
          </Section>
        )}
        </div>

        <div className="flex items-center justify-between mt-4">
          <button
            onClick={goPrev}
            disabled={stepIndex === 0}
            className="text-sm px-4 py-2 rounded border border-line-300 text-ink-500 bg-white hover:bg-surface-100 disabled:opacity-40 disabled:cursor-not-allowed"
          >
            Back
          </button>
          <span className="text-xs text-ink-400">
            Step {stepIndex + 1} of {SECTIONS.length}
          </span>
          <button
            onClick={goNext}
            disabled={stepIndex === SECTIONS.length - 1}
            className="text-sm px-4 py-2 rounded bg-accent-600 text-white hover:bg-accent-700 disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1"
          >
            Next <ChevronRight size={14} />
          </button>
          </div>
        </main>
        </div>
      </div>
    </div>
  );
}

function Section({ title, subtitle, children }) {
  return (
    <div>
      <div className="mb-5 pb-3 border-b border-line-200">
        <h2
          className="text-[15px] font-semibold text-ink-900 uppercase tracking-wide"
          style={{ fontFamily: '"IBM Plex Sans Condensed", sans-serif' }}
        >
          {title}
        </h2>
        <p className="text-[12.5px] text-ink-500 mt-1">{subtitle}</p>
      </div>
      {children}
    </div>
  );
}

function Stat({ label, value }) {
  return (
    <div className="bg-white border border-line-200 rounded p-3">
      <div className="text-xs text-ink-500 mb-1">{label}</div>
      <div className="text-sm font-mono text-ink-900">{value}</div>
    </div>
  );
}

function ResultCard({ title, result, accent, demand }) {
  const colors = {
    emerald: "border-good-600 bg-good-50",
    sky: "border-warn-600 bg-warn-50",
    slate: "border-line-200 bg-surface-100",
  };
  return (
    <div className={`rounded border p-3 ${colors[accent]}`}>
      <div className="text-xs text-ink-500 mb-2">{title}</div>
      <div className="text-xl font-mono text-ink-900 mb-1">₹{result.totalCost.toLocaleString()}</div>
      {result.unmet > 0 && (
        <div className="text-xs text-bad-600 flex items-center gap-1 mb-2">
          <AlertTriangle size={12} /> {result.unmet} units unmet demand
        </div>
      )}
      {result.rows.length > 0 ? (
        <table className="w-full text-xs mt-2 border-collapse">
          <thead>
            <tr className="text-ink-500">
              <th className="text-left font-normal pb-1">Supplier</th>
              <th className="text-right font-normal pb-1">Units</th>
              <th className="text-right font-normal pb-1">% demand</th>
              <th className="text-right font-normal pb-1">Cost</th>
            </tr>
          </thead>
          <tbody>
            {result.rows.map((r, i) => (
              <tr key={i} className="border-t border-line-200">
                <td className="py-1 text-ink-900">
                  {r.supplier}
                  {r.risk > 0 && <span className="text-accent-600"> ({r.risk}% risk)</span>}
                </td>
                <td className="py-1 text-right font-mono text-ink-900">{r.allocated}</td>
                <td className="py-1 text-right font-mono text-ink-500">
                  {demand > 0 ? ((r.allocated / demand) * 100).toFixed(1) : "0.0"}%
                </td>
                <td className="py-1 text-right font-mono text-ink-500">₹{r.cost.toLocaleString()}</td>
              </tr>
            ))}
          </tbody>
        </table>
      ) : (
        <div className="text-xs text-ink-500 mt-2">No eligible suppliers</div>
      )}
    </div>
  );
}


const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<SourcingDashboard />);

</script>
</body>
</html>
